services:
  postgres:
    image: postgres:16-alpine
    container_name: quintal-agropet-postgres

    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: quintal_agro_pet
      PGDATA: /data/postgres

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d quintal_agro_pet"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./data/pg:/data/postgres

    networks:
      - agropet_net

networks:
  agropet_net:
    driver: bridge
    name: agropet_network
