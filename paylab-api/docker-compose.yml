services:
  postgres:
    image: postgres:16-alpine
    container_name: paylab-postgres

    environment:
      POSTGRES_USER: paylab
      POSTGRES_PASSWORD: paylab
      POSTGRES_DB: paylab
      PGDATA: /data/postgres

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylab -d paylab"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./data/pg:/data/postgres

    networks:
      - paylab_net

networks:
  paylab_net:
    driver: bridge
    name: paylab_network
